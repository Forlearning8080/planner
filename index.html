<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
            padding: 30px;
            width: 100%;
            max-width: 500px;
        }

        h1 {
            font-size: clamp(2rem, 6vw, 3rem);
            margin-bottom: 12px;
            letter-spacing: -1px;
        }

        p {
            color: #999;
            margin-bottom: 35px;
            font-size: 1rem;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            display: block;
            padding: 17px 24px;
            border: 1px solid #333;
            border-radius: 10px;
            background: #111;
            color: #fff;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .btn:hover {
            background: #ff6b00;
            border-color: #ff6b00;
            color: #000;
            transform: translateY(-3px);
        }

        .footer {
            margin-top: 35px;
            color: #555;
            font-size: 0.8rem;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Study Dashboard</h1>
        <p>Choose where you want to begin.</p>

        <div class="buttons">
            <a class="btn" href="./eng/">Engineering</a>
            <a class="btn" href="./par/">Practical</a>
        </div>

        <div class="footer">
            Your personal learning space.
        </div>
    </main>
</body>
</html>
