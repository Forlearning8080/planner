<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="robots" content="noindex,nofollow"/><title>Knowledge Dashboard</title>
<script>(function(){var t=localStorage.getItem("plk_theme")||"system";if(t==="system")t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";document.documentElement.dataset.t=t;})();</script>
<style>
@property --pp{syntax:"<number>";inherits:false;initial-value:0}
:root{--bg:#f4f4f2;--c:#fff;--tx:#0a0a0a;--mu:#5c5c5c;--bd:#e6e6e3;--ac:#ff6a00;--at:#c2410c;--ink:#000;--ok:#15803d;--wa:#c2410c;--er:#b91c1c;--sh:0 1px 2px #0000000d,0 8px 24px -12px #00000026;--ease:cubic-bezier(.2,.8,.2,1)}
[data-t="dark"]{--bg:#000;--c:#111;--tx:#f5f5f5;--mu:#a3a3a3;--bd:#262626;--at:#ff8a3d;--ok:#4ade80;--wa:#ffb066;--er:#f87171;--sh:0 8px 28px -12px #000}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.01em;background:var(--bg);color:var(--tx);transition:background .3s,color .3s}
h2{font-size:28px;letter-spacing:-.03em;margin:4px 0 14px}h3{margin:18px 0 8px;letter-spacing:-.02em}
a{color:var(--at);text-decoration:none;font-weight:600}a:hover{text-decoration:underline}
::selection{background:var(--ac);color:#000}::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:8px}
header{display:flex;gap:10px;align-items:center;padding:10px 18px;background:color-mix(in srgb,var(--c) 85%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5;flex-wrap:wrap;animation:down .5s var(--ease) both}
.logo{display:flex;align-items:center;gap:8px;font-size:16px;letter-spacing:-.03em}
.logo i{width:14px;height:14px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 0 #ff6a0066;animation:ping 2.4s infinite}
#q{flex:1;min-width:140px;max-width:420px;border-radius:999px;padding:8px 16px;background:var(--bg)}
#sr{position:absolute;top:56px;left:210px;background:var(--c);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);max-width:440px;width:90%;z-index:9;max-height:60vh;overflow:auto;padding:6px;animation:pop .18s var(--ease)}
#sr div{padding:7px 12px;cursor:pointer;border-radius:8px}#sr div:hover,#sr div:focus{background:var(--ac);color:#000;outline:0}
.wrap{display:flex;min-height:calc(100vh - 58px)}
nav{width:210px;padding:14px 10px;background:var(--c);border-right:1px solid var(--bd);transition:width .3s var(--ease)}nav.col{width:62px}nav.col span{display:none}
nav button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:10px 12px;margin-bottom:2px;border-radius:12px;color:var(--tx);font-weight:500;transition:background .2s,transform .2s,color .2s}
nav button:hover{background:var(--bg);transform:translateX(3px)}nav button.on{background:var(--ac);color:#000;font-weight:700;box-shadow:0 6px 18px -6px #ff6a0099}
main{flex:1;padding:22px;min-width:0;max-width:1240px;outline:0}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--c);border:1px solid var(--bd);border-radius:10px;padding:7px 12px;transition:border-color .2s,box-shadow .2s,transform .15s,background .2s,filter .2s}
button{cursor:pointer;font-weight:500}button:hover{border-color:var(--ac)}button:active{transform:scale(.96)}
button.pri{background:var(--ac);color:#000;border-color:var(--ac);font-weight:700}button.pri:hover{filter:brightness(1.08);box-shadow:0 6px 18px -6px #ff6a00cc}button.dg{color:var(--er)}
button:focus-visible,input:focus,select:focus,textarea:focus,[tabindex]:focus-visible{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px #ff6a0040}
button:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--c);border:1px solid var(--bd);border-radius:18px;padding:16px;box-shadow:var(--sh);transition:transform .25s var(--ease),border-color .25s,box-shadow .25s}
.click{cursor:pointer}.click:hover{transform:translateY(-4px);border-color:var(--ac);box-shadow:0 14px 32px -14px #ff6a0099}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin:12px 0}
.mu{color:var(--mu)}.sm{font-size:13px}.er{color:var(--er)}.ok{color:var(--ok)}.wa{color:var(--wa)}
.big{font-size:30px;letter-spacing:-.04em;font-variant-numeric:tabular-nums;display:block;line-height:1.2}.big2{font-size:22px;letter-spacing:-.03em}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),#ffa14d);border-radius:8px;transition:width .6s var(--ease)}
.tag{display:inline-block;border:1px solid var(--bd);border-radius:999px;padding:0 9px;font-size:12px;margin:0 3px;background:var(--bg)}
.r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 6px;border-bottom:1px solid var(--bd);border-radius:10px;transition:background .2s}.r:hover{background:var(--bg)}.r>.g{flex:1;min-width:140px}
.hero{display:flex;gap:22px;align-items:center;margin:8px 0;background:var(--tx);color:var(--bg);border:0}.hero .mu{color:inherit;opacity:.7}
.ring{--pp:var(--p);width:104px;height:104px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--ac) calc(var(--pp)*1%),#ffffff2e 0);flex:none}
.ring span{width:80px;height:80px;border-radius:50%;background:var(--tx);display:grid;place-items:center;font-weight:800;font-size:22px;color:var(--ac)}
.wk{display:flex;gap:8px;align-items:flex-end;height:100px}.wk div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.wk i{display:block;background:var(--ac);min-height:3px;border-radius:6px 6px 0 0;transition:height .6s var(--ease)}
.tmrb{font-size:48px;font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums;margin-bottom:6px}.tmrb.live{color:var(--ac);animation:pulse 1.6s ease-in-out infinite}
dialog{border:1px solid var(--bd);border-radius:20px;background:var(--c);color:var(--tx);max-width:540px;width:94vw;max-height:90vh;box-shadow:0 30px 80px -20px #000a;padding:22px}
dialog[open]{animation:pop .25s var(--ease)}dialog::backdrop{background:#000a;backdrop-filter:blur(4px);animation:fade .25s}
dialog label{display:block;margin:10px 0;font-size:13px;font-weight:600}dialog input,dialog select,dialog textarea{width:100%;display:block;margin-top:4px;font-weight:400}
#toast{position:fixed;bottom:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:99}
#toast div{background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;border-left:4px solid var(--ac);box-shadow:var(--sh);animation:slide .35s var(--ease)}#toast .e{background:var(--er);color:#fff}
main.anim>*,main.anim .grid>*{animation:up .55s var(--ease) both}
main.anim .grid>*:nth-child(2){animation-delay:.05s}main.anim .grid>*:nth-child(3){animation-delay:.1s}main.anim .grid>*:nth-child(4){animation-delay:.15s}main.anim .grid>*:nth-child(5){animation-delay:.2s}main.anim .grid>*:nth-child(6){animation-delay:.25s}main.anim .grid>*:nth-child(n+7){animation-delay:.3s}
main.anim>*:nth-child(2){animation-delay:.05s}main.anim>*:nth-child(3){animation-delay:.1s}main.anim>*:nth-child(n+4){animation-delay:.15s}
main.anim .bar i{animation:grow .9s var(--ease) both}main.anim .wk i{animation:rise .8s var(--ease) both}main.anim .ring{animation:rg 1.3s var(--ease) both}
@keyframes up{from{opacity:0;transform:translateY(16px)}}@keyframes down{from{opacity:0;transform:translateY(-100%)}}@keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}}@keyframes fade{from{opacity:0}}@keyframes slide{from{opacity:0;transform:translateX(40px)}}
@keyframes grow{from{transform:scaleX(0);transform-origin:left}}@keyframes rise{from{transform:scaleY(0);transform-origin:bottom}}@keyframes rg{from{--pp:0}}@keyframes ping{70%{box-shadow:0 0 0 9px #ff6a0000}}@keyframes pulse{50%{opacity:.6}}
@media(max-width:760px){.wrap{flex-direction:column}nav{width:100%;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--bd);padding:8px}nav button{width:auto;white-space:nowrap}nav.col{width:100%}nav.col span{display:inline}#sr{left:8px}main{padding:14px}.hero{flex-direction:column;text-align:center}h2{font-size:23px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.card>.r:last-child{border-bottom:0}nav button{position:relative}
.bdg{position:absolute;top:5px;right:8px;background:var(--ac);color:#000;font:700 11px/1 system-ui;border-radius:999px;padding:3px 6px;font-style:normal;animation:pop .3s var(--ease)}
.ci{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:21px;background:color-mix(in srgb,var(--ac) 16%,var(--bg));flex:none;margin-bottom:6px;transition:transform .3s var(--ease)}.click:hover .ci{transform:rotate(-8deg) scale(1.1)}
.nextc{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:12px 0;border-color:var(--ac);background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 14%,var(--c)),var(--c))}
.nextc .ci{margin:0;width:54px;height:54px;font-size:28px}.nextc h3{margin:2px 0;font-size:22px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--at);text-transform:uppercase}
.heat{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;grid-auto-columns:14px;gap:4px;margin-top:10px;overflow-x:auto;padding-bottom:4px}
.heat i{border-radius:4px;background:var(--bd);transition:transform .15s}.heat i:hover{transform:scale(1.4)}
.heat i[data-l="1"]{background:color-mix(in srgb,var(--ac) 30%,var(--bd))}.heat i[data-l="2"]{background:color-mix(in srgb,var(--ac) 55%,var(--bd))}.heat i[data-l="3"]{background:var(--ac)}.heat i[data-l="4"]{background:var(--ac);box-shadow:0 0 8px var(--ac)}
.sk{height:90px;border-radius:18px;margin:12px 0;background:linear-gradient(90deg,var(--bd) 25%,var(--bg) 50%,var(--bd) 75%);background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
.cf{position:fixed;top:38vh;width:8px;height:13px;z-index:200;pointer-events:none;border-radius:2px;border:1px solid #0003;animation:cf 1.6s cubic-bezier(.2,.7,.3,1) forwards}@keyframes cf{to{transform:translate(var(--x),58vh) rotate(var(--r));opacity:0}}
@media(max-width:760px){nav{position:fixed;bottom:0;left:0;right:0;z-index:20;justify-content:space-around;border-top:1px solid var(--bd);border-bottom:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--c) 92%,transparent);backdrop-filter:blur(14px)}
nav button{flex-direction:column;gap:2px;font-size:10px;padding:6px 2px;flex:1;min-width:0}nav button span{display:block!important;overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}main{padding-bottom:90px}header .logo+input{order:5;flex-basis:100%;max-width:none}}
.i{width:1.2em;height:1.2em;flex:none;fill:none;vertical-align:-.22em}button{display:inline-flex;align-items:center;gap:7px}.ci .i{width:24px;height:24px}.nextc .ci .i{width:30px;height:30px}.stars{display:inline-flex;gap:2px;vertical-align:middle}.stars .i{width:13px;height:13px;vertical-align:0;color:var(--ac)}.stars .i:not(.on){color:var(--bd)}nav button .i{width:20px;height:20px}
</style></head>
