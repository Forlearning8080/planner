<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="robots" content="noindex,nofollow"/><title>Fit Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&display=swap" rel="stylesheet">
<script>(function(){document.documentElement.dataset.t=localStorage.getItem("fit_theme")||"dark"})()</script>
<style>
:root{--bg:#fbfaf9;--tx:#140a05;--mu:#6b625c;--g:rgba(255,255,255,.66);--bd:rgba(20,10,5,.1);--fl:#ff5a1f;--fl2:#ff9f1c;--on:#170700;--ok:#15803d;--er:#dc2626;--bl:#0369a1;--am:#b45309;--hi:rgba(255,90,31,.07);--sh:0 10px 30px -14px rgba(120,40,0,.3);--ease:cubic-bezier(.2,.8,.2,1)}
[data-t=dark]{--bg:#050302;--tx:#f6efea;--mu:#a39a93;--g:rgba(255,255,255,.045);--bd:rgba(255,255,255,.1);--ok:#4ade80;--er:#ff6b6b;--bl:#7dd3fc;--am:#fbbf24;--hi:rgba(255,255,255,.065);--sh:0 10px 34px -14px #000}
*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;min-height:100vh;font:14.5px/1.55 "Alan Sans",Geist,Inter,system-ui,sans-serif;letter-spacing:-.011em;color:var(--tx);font-feature-settings:"tnum";background:radial-gradient(800px 480px at 10% -8%,#ff5a1f30,transparent),radial-gradient(640px 420px at 95% 0,#ff9f1c1f,transparent),radial-gradient(700px 400px at 50% 115%,#ff3d0018,transparent) fixed}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(var(--bd) 1px,transparent 1px),linear-gradient(90deg,var(--bd) 1px,transparent 1px);background-size:44px 44px;opacity:.55;-webkit-mask-image:radial-gradient(ellipse at 50% 0,#000 10%,transparent 68%);mask-image:radial-gradient(ellipse at 50% 0,#000 10%,transparent 68%)}
::selection{background:var(--fl);color:var(--on)}
h2{font-size:28px;letter-spacing:-.045em;margin:0 0 14px}h3{font-size:15px;margin:24px 0 8px;letter-spacing:-.02em}a{color:var(--tx);text-decoration:none;font-weight:600}a:hover{color:var(--fl)}
.i{width:1.2em;height:1.2em;flex:none;fill:none;vertical-align:-.22em}
header{display:flex;gap:14px;align-items:center;padding:9px 22px;position:sticky;top:0;z-index:5;background:var(--g);backdrop-filter:blur(22px) saturate(170%);border-bottom:1px solid var(--bd);flex-wrap:wrap;animation:dn .6s var(--ease) both}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:-.04em}.logo .i{width:22px;height:22px;color:var(--fl);filter:drop-shadow(0 0 8px #ff5a1f99)}.sp{flex:1}
nav{display:flex;gap:2px}nav button{display:inline-flex;align-items:center;gap:7px;border:0;background:none;color:var(--mu);padding:7px 13px;border-radius:9px;position:relative;font-weight:500}nav button:hover{background:var(--hi);color:var(--tx)}nav button.on{color:var(--tx);background:var(--hi);box-shadow:inset 0 -2px 0 var(--fl)}nav button.on .i{color:var(--fl)}
.bdg{position:absolute;top:-4px;right:-3px;background:var(--fl);color:var(--on);font:800 10px/1 system-ui;border-radius:99px;padding:3px 6px;font-style:normal;animation:pop .35s var(--ease)}
main{max-width:1040px;margin:0 auto;padding:26px 22px 70px;outline:0}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--g);border:1px solid var(--bd);border-radius:10px;padding:7px 13px;backdrop-filter:blur(10px);transition:background .2s,border-color .2s,transform .15s,box-shadow .2s}
button{cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:7px}button:hover{background:var(--hi);border-color:var(--fl)}button:active{transform:scale(.96)}
button.pri{background:linear-gradient(135deg,var(--fl),var(--fl2));color:var(--on);border-color:transparent;font-weight:700;box-shadow:0 6px 20px -8px var(--fl)}button.pri:hover{filter:brightness(1.08);box-shadow:0 8px 26px -6px var(--fl)}button.dg{color:var(--er)}button small{opacity:.6;font-size:11px}
button:focus-visible,input:focus,select:focus,textarea:focus{outline:0;border-color:var(--fl);box-shadow:0 0 0 3px #ff5a1f40}
.card{position:relative;overflow:hidden;background:var(--g);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:10px 0;backdrop-filter:blur(20px) saturate(150%);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.07);transition:border-color .25s,transform .25s var(--ease)}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(240px circle at var(--mx,50%) var(--my,0),#ff5a1f26,transparent 70%)}.card:hover::before{opacity:1}.card:hover{border-color:#ff5a1f66}
.click{cursor:pointer}.click:hover{transform:translateY(-3px)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:12px 0}.grid .card{margin:0}
.mu{color:var(--mu)}.sm{font-size:12.5px}.er{color:var(--er)}.ok{color:var(--ok)}.big{font-size:34px;font-weight:700;letter-spacing:-.055em;display:block;line-height:1.15}
.mis{padding:24px;border-color:#ff5a1f77;background:linear-gradient(135deg,#ff5a1f2b,#ff9f1c10 60%),var(--g)}.mt{font-size:32px;font-weight:700;letter-spacing:-.05em;margin:4px 0 8px;line-height:1.15}
.bar{height:7px;background:var(--hi);border-radius:8px;overflow:hidden;margin:9px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--fl),var(--fl2));border-radius:8px;transition:width .6s var(--ease)}
.tag{display:inline-block;border:1px solid var(--bd);border-radius:99px;padding:1px 10px;font-size:12px;white-space:nowrap;background:var(--hi)}
.nw{color:var(--fl);border-color:var(--fl);font-weight:700}.rv{color:var(--bl);border-color:var(--bl);font-weight:600}.wn{color:var(--am);border-color:var(--am)}.ms{color:var(--ok);border-color:var(--ok);font-weight:600}
.r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 6px;border-bottom:1px solid var(--bd);border-radius:10px;transition:background .2s}.r:hover{background:var(--hi)}.card>.r:last-child{border-bottom:0}.r>.g{flex:1;min-width:180px}
.warn{border-color:var(--er);color:var(--er);background:#ef444414}.emp{display:flex;gap:8px;align-items:center;justify-content:center;padding:14px;color:var(--mu)}.emp .i{color:var(--ok)}
.fl{color:var(--fl);animation:flk 1.5s ease-in-out infinite;transform-origin:50% 90%}
.wk{display:flex;gap:4px;align-items:flex-end;height:90px}.wk div{flex:1;text-align:center;font-size:10px;color:var(--mu)}.wk i{display:block;background:linear-gradient(var(--fl2),var(--fl));min-height:2px;border-radius:4px 4px 0 0}
.heat{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;grid-auto-columns:14px;gap:4px;overflow-x:auto;padding-bottom:4px}.heat i{border-radius:4px;background:var(--hi);transition:transform .15s}.heat i:hover{transform:scale(1.5)}
.heat i[data-l="1"]{background:#ff5a1f45}.heat i[data-l="2"]{background:#ff5a1f90}.heat i[data-l="3"]{background:var(--fl)}.heat i[data-l="4"]{background:var(--fl2);box-shadow:0 0 9px var(--fl)}
.rr{display:flex;gap:18px;align-items:center}.bs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.bs div{border:1px solid #ff5a1f66;border-radius:14px;padding:12px;text-align:center;background:var(--hi);box-shadow:0 0 22px -10px var(--fl)}.bs .lk{opacity:.4;border-color:var(--bd);box-shadow:none;filter:grayscale(1)}.bs b{display:block;font-size:16px}.bs .i{width:26px;height:26px;color:var(--fl);margin-bottom:4px}
dialog{border:1px solid var(--bd);border-radius:20px;background:var(--bg);color:var(--tx);max-width:540px;width:94vw;padding:22px;box-shadow:0 30px 80px -20px #000}dialog[open]{animation:pop .25s var(--ease)}dialog::backdrop{background:#0009;backdrop-filter:blur(6px)}
dialog label{display:block;margin:10px 0;font-size:13px;font-weight:600}dialog input,dialog select,dialog textarea{width:100%;margin-top:4px;font-weight:400}
.rc{font-size:23px;font-weight:700;letter-spacing:-.035em}.cue{border-left:3px solid var(--fl);padding:6px 12px;margin:8px 0;background:var(--hi);border-radius:0 10px 10px 0}
#toast{position:fixed;bottom:16px;right:16px;z-index:99}#toast div{background:linear-gradient(135deg,var(--fl),var(--fl2));color:var(--on);font-weight:600;padding:10px 16px;border-radius:12px;margin-top:8px;animation:sl .35s var(--ease)}#toast .e{background:var(--er);color:#fff}
.cf{position:fixed;top:38vh;width:8px;height:13px;z-index:200;pointer-events:none;border-radius:2px;animation:cf 1.7s cubic-bezier(.2,.7,.3,1) forwards}
main.anim>*,main.anim .grid>*{animation:up .55s var(--ease) both}main.anim>*:nth-child(2){animation-delay:.05s}main.anim>*:nth-child(3){animation-delay:.1s}main.anim>*:nth-child(4){animation-delay:.15s}main.anim>*:nth-child(n+5){animation-delay:.2s}
main.anim .grid>*:nth-child(2){animation-delay:.08s}main.anim .grid>*:nth-child(3){animation-delay:.16s}main.anim .grid>*:nth-child(n+4){animation-delay:.22s}
main.anim .bar i{animation:gr .9s var(--ease) both}main.anim .wk i{animation:rs .8s var(--ease) both}main.anim .heat i{animation:fd .5s both}
.rgc{animation:rg 1.3s var(--ease) both}
@keyframes up{from{opacity:0;transform:translateY(14px)}}@keyframes dn{from{opacity:0;transform:translateY(-100%)}}@keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}}@keyframes sl{from{opacity:0;transform:translateX(40px)}}@keyframes fd{from{opacity:0}}
@keyframes gr{from{transform:scaleX(0);transform-origin:left}}@keyframes rs{from{transform:scaleY(0);transform-origin:bottom}}@keyframes rg{from{stroke-dasharray:0 302}}
@keyframes flk{50%{transform:scale(1.14) rotate(-5deg);filter:drop-shadow(0 0 6px var(--fl))}}@keyframes cf{to{transform:translate(var(--x),58vh) rotate(var(--r));opacity:0}}
@media(max-width:760px){nav{position:fixed;bottom:0;left:0;right:0;z-index:20;justify-content:space-around;background:var(--g);backdrop-filter:blur(22px);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}nav button{flex-direction:column;gap:2px;font-size:11px;flex:1}main{padding:18px 14px 96px}.mt{font-size:26px}}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}

.run{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:22px;text-align:center;background:radial-gradient(700px 500px at 50% 0,#ff5a1f2e,transparent),var(--bg);overflow:auto;animation:fd .3s}.run[hidden]{display:none}
.rt{display:flex;justify-content:space-between;align-items:center;width:min(90vw,420px)}
.cd{font-size:clamp(84px,24vw,140px);font-weight:800;letter-spacing:-.06em;line-height:1;background:linear-gradient(135deg,var(--fl),var(--fl2));-webkit-background-clip:text;background-clip:text;color:transparent}
.tap{width:min(64vw,260px);aspect-ratio:1;border-radius:50%;border:0;font-size:30px;font-weight:800;justify-content:center;background:linear-gradient(135deg,var(--fl),var(--fl2));color:var(--on);box-shadow:0 0 80px -12px var(--fl);animation:pl 2s ease-in-out infinite}.tap:hover{background:linear-gradient(135deg,var(--fl),var(--fl2));filter:brightness(1.08)}
@keyframes pl{50%{box-shadow:0 0 110px -4px var(--fl);transform:scale(1.03)}}
.ph{display:inline-block;padding:3px 14px;border-radius:99px;border:1px solid var(--fl);color:var(--fl);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:12px}
.md{display:block;width:min(92vw,420px);max-height:34vh;aspect-ratio:16/9;object-fit:cover;border:1px solid var(--bd);border-radius:18px;background:#000;box-shadow:0 20px 50px -20px var(--fl)}.tap.sm2{width:min(40vw,160px);font-size:22px}.dm{font-size:13px;color:var(--fl)}
.wd{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.wd div{border:1px solid var(--bd);border-radius:12px;padding:8px 2px;text-align:center;font-size:12px;background:var(--hi)}.wd .on{background:linear-gradient(135deg,var(--fl),var(--fl2));color:var(--on);font-weight:700;border-color:transparent}.wd .rs{opacity:.45}.wd .td{box-shadow:0 0 0 2px var(--fl)}</style></head><body>

<script>
"use strict";
/*SEED*/
const LB=[["squat","Squats","reps",10,20,2,"split"],["split","Split squats (each leg)","reps",6,12,2,"jsq"],["jsq","Jump squats","reps",8,15,2,""],["incl","Incline push-ups","reps",8,15,2,"push"],["push","Push-ups","reps",6,15,2,"decl"],["decl","Decline push-ups","reps",6,12,2,""],["glute","Glute bridges","reps",12,20,2,"slb"],["slb","Single-leg glute bridges (each leg)","reps",8,14,2,""],["bird","Bird dogs (each side)","reps",10,16,2,"dead"],["dead","Dead bugs (each side)","reps",10,16,2,""],["calf","Calf raises","reps",15,25,2,"slc"],["slc","Single-leg calf raises (each leg)","reps",10,18,2,""],["plank","Forearm plank","time",20,60,5,"side"],["side","Side plank (each side)","time",15,40,5,""],["lunge","Reverse lunges (each leg)","reps",8,14,2,""],["super","Supermans","reps",10,16,2,""],["mtn","Mountain climbers","time",20,40,5,""],["wall","Wall sit","time",20,60,5,""],["dip","Chair dips","reps",6,14,2,""],["hinge","Hip hinges (bodyweight)","reps",12,20,2,""],["holl","Hollow hold","time",15,40,5,""],["pike","Pike push-ups","reps",5,12,1,""],["jj","Jumping jacks","time",20,40,5,""]];
const NEWQ=["lunge","super","mtn","wall","dip","hinge","holl","pike","jj"];
function seed(){return{schemaVersion:1,app:{name:"Fit Planner",revision:0,lastModifiedAt:new Date().toISOString()},settings:{restSet:45,restEx:60,warm:60,cool:60,days:[1,3,5,6],sound:true,auto:true},library:LB.map(([id,name,type,min,max,step,next])=>({id,name,type,min,max,step,next,media:""})),plan:[["squat",10],["incl",8],["glute",12],["bird",10],["calf",15],["plank",20]].map(([id,reps])=>({id,sets:2,reps,easy:0,hard:0,addedAt:null})),queue:NEWQ.slice(),lastAdd:new Date().toISOString().slice(0,10),overrides:{},log:[],changes:[]}}
/*END*/
/* ===== Core ===== */
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const ld=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),today=()=>ld(new Date());
const addD=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return ld(d)},gap=(a,b)=>Math.round((new Date(a+"T12:00")-new Date(b+"T12:00"))/864e5),dw=d=>(new Date(d+"T12:00").getDay()+6)%7,wk0=d=>addD(d,-dw(d));
const ic=(n,c="")=>`<svg class="i ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`,IC={today:"home",plan:"cur",prog:"chart",set:"set"};
const KEY="fit_v1",DN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
let S,view="today",RC=null,R=null,AU=null,WL=null;
const L=id=>S.library.find(x=>x.id===id)||{id,name:id,type:"reps",min:1,max:1,step:1,next:""},un=b=>b.type==="time"?" sec":" reps",mmss=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
function toast(m,e){const d=document.createElement("div");d.textContent=m;if(e)d.className="e";$("#toast").append(d);setTimeout(()=>d.remove(),e?5000:3800)}
function dl(o,n){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,1)],{type:"application/json"}));a.download=n;a.click()}
const fix=d=>{const s=seed();d.settings=Object.assign(s.settings,d.settings);d.library=d.library||s.library;s.library.forEach(x=>{if(!d.library.some(y=>y.id===x.id))d.library.push(x)});["queue","overrides","changes"].forEach(k=>d[k]=d[k]||s[k]);d.lastAdd=d.lastAdd||s.lastAdd;return d};
function save(){S.app.revision++;S.app.lastModifiedAt=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Save failed: "+e.message,1)}cfg.pending=true;saveCfg();render();queueSync()}
/* ===== Training days, rest days, streak ===== */
const trained=d=>S.log.some(l=>l.date===d),sched=d=>S.overrides[d]?S.overrides[d]==="train":S.settings.days.includes(new Date(d+"T12:00").getDay());
function consec(){let n=0,d=addD(today(),-1);while(trained(d)){n++;d=addD(d,-1)}return n}
function status(){const t=today();if(trained(t))return"done";if(S.overrides[t])return S.overrides[t];if(!sched(t))return"rest";return consec()>=3?"rest":"train"}
function streak(){if(!S.log.length)return 0;const f=S.log.map(l=>l.date).sort()[0];let n=0,d=trained(today())?today():addD(today(),-1);for(;d>=f;d=addD(d,-1)){if(trained(d))n++;else if(sched(d))break}return n}
function nextDay(){for(let i=1;i<=7;i++){const d=addD(today(),i);if(sched(d))return i===1?"tomorrow":DN[new Date(d+"T12:00").getDay()]}return"—"}
function est(){const s=S.settings;let t=s.warm+s.cool;S.plan.forEach((p,i)=>{const b=L(p.id);for(let k=0;k<p.sets;k++){t+=b.type==="time"?p.reps+5:p.reps*3+8;t+=k<p.sets-1?s.restSet:i<S.plan.length-1?s.restEx:0}});return Math.round(t/60)}
/* ===== Auto progression: rate Easy/Hard after a session ===== */
function bump(p,b,o){if(p.reps<b.max){p.reps=Math.min(b.max,p.reps+b.step);o.push(b.name+" up to "+p.reps+un(b))}else if(p.sets<4){p.sets++;p.reps=b.min;o.push(b.name+": now "+p.sets+" sets")}else{const i=S.plan.indexOf(p),n=b.next&&L(b.next);if(n&&n.name!==n.id){S.plan[i]={id:n.id,sets:2,reps:n.min,easy:0,hard:0,addedAt:today()};o.push("Upgraded "+b.name+" to "+n.name)}else{S.plan.splice(i,1);o.push("Retired "+b.name+", it got too easy")}}}
function ease(p,b,o){if(p.reps>b.min){p.reps=Math.max(b.min,p.reps-b.step);o.push(b.name+" eased to "+p.reps+un(b))}else if(p.sets>2){p.sets--;o.push(b.name+" down to "+p.sets+" sets")}}
function addNew(o){const t=today(),rec=S.log.filter(l=>l.date>addD(t,-14)).length;if(S.plan.length>=9||!((gap(t,S.lastAdd)>=14&&rec>=5)||S.plan.length<5))return;const id=S.queue.find(x=>!S.plan.some(p=>p.id===x));if(!id)return;const b=L(id);S.queue=S.queue.filter(x=>x!==id);S.plan.push({id,sets:2,reps:b.min,easy:0,hard:0,addedAt:t});S.lastAdd=t;o.push("New exercise: "+b.name)}
function progress(ex){const o=[],items=S.plan.slice();ex.forEach((e,i)=>{const p=items[i];if(!p||!e.sets)return;const b=L(p.id);
if(e.rate==="easy"){p.hard=0;if(++p.easy>=2){p.easy=0;bump(p,b,o)}}else if(e.rate==="hard"){p.easy=0;if(++p.hard>=2){p.hard=0;ease(p,b,o)}}else p.easy=p.hard=0});
addNew(o);o.forEach(t=>S.changes.unshift({date:today(),text:t}));S.changes.length=Math.min(S.changes.length,60);return o}
/* ===== Guided session: timers run themselves, you only tap ===== */
const beep=(f=880,d=.12)=>{if(!S.settings.sound)return;try{AU=AU||new AudioContext();const o=AU.createOscillator(),g=AU.createGain();o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(AU.destination);o.start();o.stop(AU.currentTime+d)}catch{}if(navigator.vibrate)navigator.vibrate(d*1000)};
async function wake(){try{WL=await navigator.wakeLock.request("screen")}catch{}}
function startRun(){const s=S.settings,st=[{k:"warm",sec:s.warm}];S.plan.forEach((p,i)=>{for(let n=1;n<=p.sets;n++){st.push({k:"set",pi:i,n});if(!(i===S.plan.length-1&&n===p.sets))st.push(n<p.sets?{k:"rest",sec:s.restSet,pi:i,n:n+1}:{k:"rest",sec:s.restEx,pi:i+1,n:1})}});st.push({k:"cool",sec:s.cool});
R={st,i:-1,t0:Date.now(),sets:{},rate:{},run:false,sub:"wait",last:-1};wake();nextStep()}
function enter(){const s=R.st[R.i];R.sub="wait";R.last=-1;if(s.k!=="set"){R.end=Date.now()+s.sec*1000;R.run=true;beep(520,.1)}else R.run=false;draw()}
function nextStep(){R.i++;if(R.i>=R.st.length){R.fin=true;R.run=false;R.dur=Math.round((Date.now()-R.t0)/1000);beep(990,.4);draw()}else enter()}
function doneSet(){const s=R.st[R.i];R.sets[s.pi]=(R.sets[s.pi]||0)+1;R.run=false;nextStep()}
function stopRun(){R=null;$("#run").hidden=true;try{WL&&WL.release()}catch{}}
setInterval(()=>{if(!R||!R.run)return;const l=Math.max(0,Math.ceil((R.end-Date.now())/1000)),e=$("#cd");if(e)e.textContent=l;if(l!==R.last){R.last=l;if(l>0&&l<=3)beep(660,.08)}if(l<=0){R.run=false;beep(990,.3);R.st[R.i].k==="set"?doneSet():nextStep()}},200);
function draw(){const o=$("#run"),tot=R.st.length;o.hidden=false;
const top=`<div class="rt"><button data-a="rquit">Quit</button><span class="sm mu">${Math.min(R.i+1,tot)} / ${tot}</span></div><div class="bar" style="width:min(90vw,420px)"><i style="width:${Math.max(0,R.i)/tot*100}%"></i></div>`;
if(R.fin){const ex=S.plan.map((p,i)=>[p,i]).filter(([p,i])=>R.sets[i]);o.innerHTML=`${top}<span class="ph">Complete</span><h2 style="margin:0">Nice work. ${mmss(R.dur)}</h2><p class="sm mu">How did each one feel? Easy twice in a row levels it up. Hard twice eases it.</p><div class="card" style="width:min(92vw,460px);text-align:left">${ex.map(([p,i])=>`<div class="r"><span class="g"><b>${esc(L(p.id).name)}</b></span>${["easy","ok","hard"].map(r=>`<button data-a="rrate" data-id="${i}" data-r="${r}" class="${(R.rate[i]||"ok")===r?"pri":""}">${{easy:"Easy",ok:"Just right",hard:"Hard"}[r]}</button>`).join("")}</div>`).join("")}</div><button class="pri" data-a="rsave">${ic("check")} Save workout</button>`;return}
const s=R.st[R.i];
if(s.k==="warm"||s.k==="cool")o.innerHTML=`${top}<span class="ph">${s.k==="warm"?"Warm up":"Cool down"}</span><div class="cd" id="cd">${s.sec}</div><p class="mu">${s.k==="warm"?"March in place, arm circles, hip circles. Start easy.":"Slow breathing. Stretch chest, hips and calves gently."}</p><div class="r" style="border:0"><button data-a="radd">+15s</button><button class="pri" data-a="rskip">Skip</button></div>`;
else if(s.k==="rest"){const p=S.plan[s.pi],b=L(p.id);o.innerHTML=`${top}<span class="ph">Rest</span>${demo(b)}<div class="cd" id="cd">${s.sec}</div><p class="mu">Next: <b>${esc(b.name)}</b> · set ${s.n} of ${p.sets} · ${p.reps}${un(b)}</p><div class="r" style="border:0"><button data-a="radd">+15s</button><button class="pri" data-a="rskip">Skip rest</button></div>`}
else{const p=S.plan[s.pi],b=L(p.id);const hd=`<span class="ph">Set ${s.n} of ${p.sets}</span><h2 style="margin:0">${esc(b.name)}</h2>${demo(b)}`;
o.innerHTML=b.type==="time"?(R.sub==="hold"?`${top}${hd}<div class="cd" id="cd">${p.reps}</div><button class="pri" data-a="rmain">Done early</button>`:`${top}${hd}<p class="mu big" style="font-size:22px">Hold ${p.reps} sec</p><button class="tap${b.media?" sm2":""}" data-a="rmain">Start</button><button data-a="rskipex">Skip exercise</button>`):`${top}${hd}<p class="mu big" style="font-size:26px">${p.reps} reps</p><button class="tap${b.media?" sm2":""}" data-a="rmain">Done</button><button data-a="rskipex">Skip exercise</button>`}}
function saveRun(){const ex=S.plan.map((p,i)=>({id:p.id,sets:R.sets[i]||0,reps:p.reps,rate:R.rate[i]||"ok"}));S.log.push({date:today(),sec:R.dur,ex});const o=S.settings.auto?progress(ex):[];stopRun();save();confetti();o.slice(0,4).forEach(t=>toast(t))}
const demo=b=>{const u=b.media;if(!u)return`<a class="dm" href="https://www.youtube.com/results?search_query=${encodeURIComponent(b.name+" proper form")}" target="_blank" rel="noopener">Find a demo video</a>`;const y=u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);if(y)return`<iframe class="md" src="https://www.youtube.com/embed/${y[1]}?autoplay=1&mute=1&loop=1&playlist=${y[1]}&controls=0&playsinline=1&rel=0" allow="autoplay;encrypted-media" allowfullscreen></iframe>`;if(/\.(mp4|webm|mov|m4v)(\?|$)/i.test(u))return`<video class="md" src="${esc(u)}" autoplay loop muted playsinline></video>`;return`<img class="md" src="${esc(u)}" alt="">`};
/* ===== Dialog ===== */
function ask(title,fs,cb,ok="Save"){const d=$("#dlg");d.innerHTML=`<form><h3 style="margin-top:0">${esc(title)}</h3>${fs.map(f=>`<label>${esc(f.l)}${f.t==="select"?`<select name="${f.k}">${f.o.map(([a,b])=>`<option value="${esc(a)}">${esc(b)}</option>`).join("")}</select>`:`<input name="${f.k}" type="${f.t||"text"}" value="${esc(f.v)}">`}</label>`).join("")}<div class="r" style="border:0"><button type="button" data-a="close">Cancel</button><button class="pri">${ok}</button></div></form>`;
d.querySelector("form").onsubmit=e=>{e.preventDefault();const v={};fs.forEach(f=>{v[f.k]=e.target.elements[f.k].value;if(f.t==="number")v[f.k]=Math.max(1,+v[f.k]||1)});d.close();cb(v)};d.showModal()}
/* ===== Views ===== */
function ring(v,t){const C=2*Math.PI*46,p=Math.min(1,v/t);return `<svg width="116" height="116" viewBox="0 0 116 116"><defs><linearGradient id="rg"><stop offset="0" stop-color="#ff9f1c"/><stop offset="1" stop-color="#ff3d00"/></linearGradient></defs><circle cx="58" cy="58" r="46" fill="none" stroke="var(--hi)" stroke-width="10"/><circle cx="58" cy="58" r="46" fill="none" class="rgc" stroke="url(#rg)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*p} ${C}" transform="rotate(-90 58 58)"/><text x="58" y="58" text-anchor="middle" font-size="26" font-weight="700" fill="currentColor">${v}</text><text x="58" y="76" text-anchor="middle" font-size="11" fill="var(--mu)">of ${t}</text></svg>`}
function heat(m){const e=addD(wk0(today()),6);let h="";for(let d=addD(wk0(today()),-112);d<=e;d=addD(d,1)){const v=m[d]||0;h+=d>today()?'<i style="background:none"></i>':`<i data-l="${v?v>1?4:3:0}" title="${d}: ${v}"></i>`}return `<div class="heat">${h}</div>`}
const V={
today(){const t=today(),st=status(),w=wk0(t),days=[...Array(7)].map((_,i)=>addD(w,i)),pl=days.filter(d=>sched(d)||trained(d)).length,dn=days.filter(trained).length,last=S.log[S.log.length-1],why=!sched(t)?"Not a training day. Muscles grow while you rest. A walk or light stretching is plenty.":"You trained 3 days in a row, so today is recovery.";
return `<h2>Today</h2><div class="card mis"><div class="sm mu">${st==="train"?"Today's workout":st==="done"?"Today":"Recovery"}</div><div class="mt">${st==="train"?est()+" min · "+S.plan.length+" exercises":st==="done"?"Workout done":"Rest day"}</div><div class="sm mu">${st==="train"?"One tap starts a guided session. The timers and rests run themselves.":st==="done"?"Recovery starts now. Next session: "+nextDay()+".":why+" Next session: "+nextDay()+"."}</div><div class="r" style="border:0;padding-left:0">${st==="train"?`<button class="pri" data-a="run">${ic("play")} Start workout</button><button data-a="ovr" data-id="rest">Make today a rest day</button>`:st==="rest"?`<button data-a="ovr" data-id="train">Train anyway</button>`:`<button data-a="run">Do another round</button>`}</div></div>
<div class="card"><div class="wd">${days.map(d=>`<div class="${trained(d)?"on":sched(d)?"":"rs"} ${d===t?"td":""}">${DN[new Date(d+"T12:00").getDay()]}<br>${trained(d)?ic("check"):sched(d)?"Train":"Rest"}</div>`).join("")}</div></div>
<div class="grid"><div class="card rr">${ring(dn,Math.max(pl,dn,1))}<div><div class="mu sm">This week</div><b>${dn>=pl?"Week goal reached":pl-dn+" session"+(pl-dn==1?"":"s")+" to go"}</b></div></div><div class="card"><div class="mu sm">${ic("flame","fl")} Streak</div><b class="big">${streak()} day${streak()==1?"":"s"}</b><div class="sm mu">Rest days never break it</div></div><div class="card"><div class="mu sm">Workouts</div><b class="big">${S.log.length}</b><div class="sm mu">${last?"last: "+last.date:"none yet"}</div></div></div>
<h3>Today's plan</h3><div class="card">${S.plan.map(p=>{const b=L(p.id);return `<div class="r"><div class="g"><b>${esc(b.name)}</b><div class="sm mu">${p.sets} × ${p.reps}${un(b)}</div></div>${p.addedAt&&gap(t,p.addedAt)<=7?'<span class="tag nw">New</span>':""}</div>`}).join("")}</div>`},
plan(){const t=today(),nx=S.queue.find(x=>!S.plan.some(p=>p.id===x));
return `<h2>Your plan</h2><p class="sm mu">It changes itself. Rate each exercise after a session: Easy twice in a row adds reps, then sets, then upgrades or retires it. Hard twice eases it. A new exercise joins every 2 weeks while you stay consistent (max 9).</p><div class="card">${S.plan.map((p,i)=>{const b=L(p.id);return `<div class="r"><div class="g"><b>${esc(b.name)}</b><div class="sm mu">${p.sets} × ${p.reps}${un(b)}${b.media?" · demo set":""}${b.next?" · next level: "+esc(L(b.next).name):""}</div></div>${p.addedAt&&gap(t,p.addedAt)<=7?'<span class="tag nw">New</span>':""}<button data-a="pedit" data-id="${i}">Edit</button><button class="dg" data-a="pdel" data-id="${i}">Remove</button></div>`}).join("")||'<p class="emp">Plan is empty.</p>'}</div><div class="r" style="border:0"><button class="pri" data-a="padd">+ Add exercise</button></div>
<h3>Coming up</h3><div class="card"><div class="sm">${nx?"Next new exercise: <b>"+esc(L(nx).name)+"</b>, not before "+addD(S.lastAdd,14)+".":"No new exercises left in the queue."}</div></div>`},
prog(){const m={};S.log.forEach(l=>m[l.date]=(m[l.date]||0)+1);const mins=Math.round(S.log.reduce((a,l)=>a+l.sec,0)/60);
return `<h2>Progress</h2><div class="grid"><div class="card"><div class="mu sm">Workouts</div><b class="big">${S.log.length}</b></div><div class="card"><div class="mu sm">Minutes trained</div><b class="big">${mins}</b></div><div class="card"><div class="mu sm">${ic("flame","fl")} Streak</div><b class="big">${streak()}</b></div></div><h3>Activity</h3><div class="card">${heat(m)}</div>
<h3>What changed</h3><div class="card">${S.changes.map(c=>`<div class="r"><span class="g">${esc(c.text)}</span><span class="sm mu">${c.date}</span></div>`).join("")||'<p class="emp">Level-ups, new exercises and retirements show up here.</p>'}</div>
<h3>History</h3><div class="card">${S.log.slice().reverse().slice(0,20).map(l=>`<div class="r"><span class="g"><b>${l.date}</b> <span class="sm mu">${l.ex.filter(e=>e.sets).map(e=>esc(L(e.id).name)+" "+e.sets+"×"+e.reps).join(", ")}</span></span><span class="tag">${mmss(l.sec)}</span></div>`).join("")||'<p class="emp">No workouts yet.</p>'}</div>`},

return `<h2>Settings</h2><div class="card"><b>Training days</b><p class="sm mu">Everything else is a rest day. After 3 days in a row, the app suggests rest.</p><div class="r" style="border:0">${[1,2,3,4,5,6,0].map(d=>`<button data-a="day" data-id="${d}" class="${s.days.includes(d)?"pri":""}">${DN[d]}</button>`).join("")}</div></div>

const NAV=[["today","Today"],["plan","Plan"],["prog","Progress"],["set","Settings"]];
function render(){if(!S)return;const n=status()==="train"?1:0;$("#nv").innerHTML=NAV.map(([i,t])=>`<button data-a="nav" data-id="${i}" class="${view===i?"on":""}">${ic(IC[i])}<span>${t}</span>${i==="today"&&n?'<em class="bdg">1</em>':""}</button>`).join("");const k=view,an=k!==render.k;render.k=k;$("#main").className=an?"anim":"";$("#main").innerHTML=V[view]();hdr();$("#dt").textContent=new Date().toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});if(an)countUp()}
function confetti(){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;const k=["#ff5a1f","#ff9f1c","#ffd166","#fff"];for(let i=0;i<50;i++){const p=document.createElement("i");p.className="cf";p.style.cssText=`left:${50+(Math.random()-.5)*20}vw;background:${k[i%4]};--x:${(Math.random()-.5)*80}vw;--r:${Math.random()*720}deg;animation-delay:${Math.random()*.15}s;z-index:300`;document.body.append(p);setTimeout(()=>p.remove(),1900)}}
function countUp(){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;document.querySelectorAll(".big").forEach(e=>{const m=e.textContent.match(/^(\d+)(\D.*)?$/);if(!m||+m[1]<1)return;const to=+m[1],t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/700);e.textContent=Math.round(to*(1-Math.pow(1-p,3)))+(m[2]||"");if(p<1)requestAnimationFrame(f)})(t0)})}
/* ===== Actions ===== */
const A={nav:id=>{view=id;render()},close:()=>$("#dlg").close(),th:()=>{const n=document.documentElement.dataset.t==="dark"?"light":"dark";document.documentElement.dataset.t=n;localStorage.setItem("fit_theme",n)},
run:()=>{if(!S.plan.length)return toast("Add an exercise first",1);startRun()},ovr:(id)=>{S.overrides[today()]=id;save()},
rmain:()=>{const s=R.st[R.i],p=S.plan[s.pi];if(L(p.id).type==="time"&&R.sub==="wait"){R.sub="hold";R.end=Date.now()+p.reps*1000;R.run=true;R.last=-1;draw()}else doneSet()},
rskip:()=>{R.run=false;nextStep()},radd:()=>{R.end+=15000},rquit:()=>{if(confirm("Quit this workout? Nothing is saved."))stopRun()},
rskipex:()=>{const c=R.st[R.i].pi;let j=R.i;while(R.st[j]&&(R.st[j].k==="set"||R.st[j].k==="rest")&&R.st[j].pi===c)j++;R.i=j-1;R.run=false;nextStep()},
rrate:(id,b)=>{R.rate[id]=b.dataset.r;draw()},rsave:saveRun,
pedit:id=>{const p=S.plan[+id],b=L(p.id);ask(b.name,[{k:"sets",l:"Sets",t:"number",v:p.sets},{k:"reps",l:b.type==="time"?"Seconds":"Reps",t:"number",v:p.reps},{k:"media",l:"Demo photo or video URL (mp4, gif, image or YouTube)",v:b.media||""}],v=>{p.sets=v.sets;p.reps=v.reps;b.media=v.media.trim();save()})},

day:id=>{const d=S.settings.days,i=d.indexOf(+id);i>=0?d.splice(i,1):d.push(+id);save()},tg:id=>{S.settings[id]=!S.settings[id];save()},
exp:()=>dl(S,"fit.json"),imp:()=>{$("#fi").value="";$("#fi").click()},clr:()=>{if(confirm("Delete ALL data in this browser? Export a backup first.")){localStorage.removeItem(KEY);S=seed();save()}}};
const C={};["restSet","restEx","warm","cool"].forEach(k=>C[k]=v=>{if(+v>=5){S.settings[k]=Math.min(300,+v);save()}});
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&A[b.dataset.a]){e.preventDefault();A[b.dataset.a](b.dataset.id,b)}});
document.addEventListener("change",e=>{const b=e.target.closest("[data-c]");if(b&&C[b.dataset.c])C[b.dataset.c](e.target.value)});
document.addEventListener("pointermove",e=>{const c=e.target.closest&&e.target.closest(".card");if(c){const r=c.getBoundingClientRect();c.style.setProperty("--mx",e.clientX-r.left+"px");c.style.setProperty("--my",e.clientY-r.top+"px")}});
document.addEventListener("keydown",e=>{if(R&&!R.fin&&(e.key===" "||e.key==="Enter")&&!$("#dlg").open){e.preventDefault();const k=R.st[R.i].k;k==="set"?A.rmain():A.rskip()}});
$("#fi").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!okD(j))throw 0;if(!confirm("Replace current data with this file?"))return;S=fix(j);save();toast("Imported")}catch{toast("Not a valid fit.json",1)}};r.readAsText(f)};
/* ===== Supabase cloud sync. Paste config JSON; PASSWORD is used once to sign in and is never stored. Anon key only. ===== */
const CFG_KEY="fit_cfgjson";let AC={};try{AC=JSON.parse(localStorage.getItem(CFG_KEY)||"{}")}catch{}
const CONFIG={};function readConf(){Object.assign(CONFIG,{URL:AC.SUPABASE_URL||"",BUCKET:AC.SUPABASE_BUCKET||"",FILE:(AC.FILES||{}).EXERCISE||"fit.json",KEY:AC.SUPABASE_ANON_KEY||"",AUTO:AC.AUTO_SYNC!==false,DELAY:AC.AUTO_SYNC_DELAY||300000})}readConf();
let cfg=Object.assign({access:"",refresh:"",exp:0,email:"",lastSync:null,lastRemoteMod:null,pending:false},JSON.parse(localStorage.getItem("fit_cfg")||"{}"));
const saveCfg=()=>localStorage.setItem("fit_cfg",JSON.stringify(cfg)),ready=()=>!!(CONFIG.URL&&CONFIG.BUCKET&&CONFIG.KEY),signed=()=>!!(cfg.refresh||cfg.access),okD=d=>!!(d&&d.schemaVersion===1&&Array.isArray(d.plan)&&Array.isArray(d.log));
let sync="off",syncErr="",tm=null,dueAt=0,chain=Promise.resolve();
const SBO=()=>CONFIG.URL+"/storage/v1/object/",SBP=()=>encodeURIComponent(CONFIG.BUCKET)+"/"+encodeURIComponent(CONFIG.FILE);
function badKey(k){if(/^sb_secret_/.test(k))return"That is a secret key. Use the publishable (anon) key.";try{const p=JSON.parse(atob(k.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));if(p.role==="service_role")return"That is the service_role key. Never put it in a web page. Use the anon key."}catch{}return""}
async function sbCall(url,o){const ac=new AbortController(),t=setTimeout(()=>ac.abort(),25000);try{return await fetch(url,Object.assign({signal:ac.signal},o))}catch{throw new Error("Network error: cannot reach Supabase (local data is safe)")}finally{clearTimeout(t)}}
function setSess(j){cfg.access=j.access_token;cfg.refresh=j.refresh_token||cfg.refresh;cfg.exp=Date.now()+(j.expires_in||3600)*1000;saveCfg()}
async function sbToken(force){if(!signed())throw new Error("Sign in required");if(!force&&cfg.access&&cfg.exp-Date.now()>60000)return cfg.access;if(!cfg.refresh){if(cfg.access&&!force)return cfg.access;throw new Error("Session expired. Paste the cloud JSON again")}
const r=await sbCall(CONFIG.URL+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:CONFIG.KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:cfg.refresh})});
if(!r.ok){cfg.access=cfg.refresh="";cfg.exp=0;saveCfg();throw new Error("Session expired. Paste the cloud JSON again")}setSess(await r.json());return cfg.access}
async function sbSignIn(email,pw){const r=await sbCall(CONFIG.URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:CONFIG.KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password:pw})});
if(!r.ok){let m="Sign-in failed ("+r.status+")";try{const j=await r.json();m=j.msg||j.error_description||j.message||m}catch{}throw new Error(m)}setSess(await r.json());cfg.email=email;saveCfg()}
async function getRemote(){let r=null;
if(signed()){try{r=await sbCall(SBO()+"authenticated/"+SBP(),{headers:{apikey:CONFIG.KEY,Authorization:"Bearer "+await sbToken(false)},cache:"no-store"})}catch{r=null}}
if(!r||(!r.ok&&r.status!==400&&r.status!==404))r=await sbCall(SBO()+"public/"+SBP()+"?t="+Date.now(),{cache:"no-store"});
if(r.status===400||r.status===404)return null;if(!r.ok)throw new Error("Supabase read failed ("+r.status+")");
let j;try{j=await r.json()}catch{throw new Error("Cloud file is not valid JSON")}return j&&typeof j==="object"?j:null}
async function putRemote(body){if(!signed())throw new Error("Click the cloud button and submit your JSON to sign in");
const up=tok=>sbCall(SBO()+SBP(),{method:"POST",headers:{apikey:CONFIG.KEY,Authorization:"Bearer "+tok,"Content-Type":"application/json","x-upsert":"true","cache-control":"no-cache"},body:JSON.stringify(body)});
let r=await up(await sbToken(false));if(r.status===401)r=await up(await sbToken(true));
if(!r.ok)throw new Error(r.status===400||r.status===403?"Permission denied ("+r.status+"). Check the storage policies and the signed-in account":"Supabase upload failed ("+r.status+")")}
/* Auto-sync: one upload per window (default 5 min) however many edits happen, and when the tab is hidden. */
function queueSync(){if(!ready()||!CONFIG.AUTO)return;sync=signed()?"pending":"nosign";hdr();if(tm)return;dueAt=Date.now()+CONFIG.DELAY;tm=setTimeout(()=>{tm=null;dueAt=0;push(false)},CONFIG.DELAY)}
function push(manual){chain=chain.then(()=>doPush(manual)).catch(()=>{});return chain}
async function doPush(manual){
if(!ready()){if(manual)toast("Cloud sync is not configured",1);return}
if(!cfg.pending&&!manual)return;
if(!signed()){sync="nosign";if(manual)toast("Click the cloud button and submit your JSON",1);hdr();return}
sync="syncing";hdr();
try{const rem=await getRemote();
if(rem&&rem.app&&cfg.lastRemoteMod&&rem.app.lastModifiedAt!==cfg.lastRemoteMod){
if(!confirm("The cloud copy changed since your last sync (maybe another device).\nOK = download a snapshot of the cloud copy, then overwrite it with local data.\nCancel = keep local only, do not upload.")){sync="conflict";syncErr="Conflict: cloud copy differs. Use the cloud dialog to reconcile.";hdr();return}
dl(rem,"cloud-snapshot-"+today()+".json")}
else if(rem&&rem.schemaVersion>1){sync="error";syncErr="Cloud has newer schema; not overwriting";hdr();return}
const snap=S.app.lastModifiedAt;await putRemote(JSON.parse(JSON.stringify(S)));
cfg.lastRemoteMod=snap;cfg.lastSync=new Date().toISOString();cfg.pending=S.app.lastModifiedAt!==snap;saveCfg();sync=cfg.pending?"pending":"synced";syncErr="";if(cfg.pending)queueSync();else if(manual)toast("Synced to Supabase")
}catch(e){sync="error";syncErr=e.message;if(manual)toast(e.message,1)}
hdr();if(view==="set")render()}
async function reconcile(){try{sync="syncing";hdr();const rem=await getRemote();
if(!okD(rem)){if(rem&&rem.schemaVersion>1){sync="error";syncErr="Cloud has newer schema";hdr();return}
if(!signed()){sync=cfg.pending?"nosign":"off";hdr();if(rem)toast("Cloud file "+CONFIG.FILE+" is not in this app's format. Sign in to replace it, or use another file name.",1);return}
if(confirm("The cloud file "+CONFIG.FILE+" is "+(rem?"not in this app's format":"empty or missing")+".\nReplace it with your local data?"+(rem?"\n(A copy of the existing file is downloaded first.)":""))){if(rem)dl(rem,"cloud-snapshot-"+today()+".json");cfg.lastRemoteMod=null;await push(true)}else{sync="off";hdr()}return}
if(!rem.app)rem.app={lastModifiedAt:"",revision:0};
if(rem.app.lastModifiedAt===cfg.lastRemoteMod){cfg.pending?await push(true):(sync="synced",hdr());return}
if(rem.app.lastModifiedAt===S.app.lastModifiedAt){cfg.lastRemoteMod=rem.app.lastModifiedAt;cfg.pending=false;cfg.lastSync=new Date().toISOString();saveCfg();sync="synced";hdr();return}
if(confirm("Cloud data and local data differ.\nCloud: revision "+rem.app.revision+", "+rem.app.lastModifiedAt+"\nLocal: revision "+S.app.revision+", "+S.app.lastModifiedAt+"\n\nOK = use CLOUD data (a local backup is downloaded first)\nCancel = keep LOCAL data and upload it (a cloud snapshot is downloaded first)")){
dl(S,"local-backup-"+today()+".json");S=fix(rem);cfg.lastRemoteMod=rem.app.lastModifiedAt;cfg.pending=false;cfg.lastSync=new Date().toISOString();saveCfg();localStorage.setItem(KEY,JSON.stringify(S));sync="synced";render();toast("Using cloud data")}
else{dl(rem,"cloud-snapshot-"+today()+".json");cfg.lastRemoteMod=rem.app.lastModifiedAt;cfg.pending=true;await push(true);render()}
}catch(e){sync="error";syncErr=e.message;hdr()}}
function checkCfg(j){if(!j||typeof j!=="object"||Array.isArray(j))return"JSON must be an object";
if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(String(j.SUPABASE_URL||"").replace(/\/+$/,"")))return"SUPABASE_URL must look like https://xxxx.supabase.co";
if(!/^[A-Za-z0-9_-]+$/.test(j.SUPABASE_BUCKET||""))return"SUPABASE_BUCKET is missing or invalid";
if(!j.SUPABASE_ANON_KEY)return"SUPABASE_ANON_KEY is missing";const e=badKey(j.SUPABASE_ANON_KEY);if(e)return e;
const f=(j.FILES||{}).EXERCISE||"fit.json";if(!/^[A-Za-z0-9._-]+\.json$/.test(f))return"FILES.EXERCISE must be a .json file name";
if(["data.json","study.json","dsa.json"].includes(f))return f+" belongs to another page; use FILES.EXERCISE = dsa.json";
if(!j.USER_MAIL&&!signed())return"USER_MAIL and PASSWORD are required to sign in";return""}
async function connectJson(text){let j;try{j=JSON.parse(text)}catch(e){throw new Error("Invalid JSON: "+e.message)}
const er=checkCfg(j);if(er)throw new Error(er);const pw=j.PASSWORD;delete j.PASSWORD;j.SUPABASE_URL=j.SUPABASE_URL.replace(/\/+$/,"");
localStorage.setItem(CFG_KEY,JSON.stringify(j));AC=j;readConf();if(j.USER_MAIL)cfg.email=j.USER_MAIL;saveCfg();
if(pw)await sbSignIn(j.USER_MAIL,pw);else if(!signed())throw new Error("PASSWORD is required to sign in")}
function syncText(){if(!ready())return"Local only (click the cloud button to connect)";if(sync==="pending"&&dueAt){const s=Math.max(0,Math.round((dueAt-Date.now())/1000));return"Changes pending, auto-sync in "+Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
return{off:"Cloud idle",pending:"Changes pending",nosign:"Sign in to sync",syncing:"Syncing…",synced:"Synced",error:"Cloud error: "+syncErr,conflict:syncErr}[sync]||sync}
function hdr(){const b=$("#sy");if(b){b.innerHTML=ic("cloud")+" "+(!ready()?"Local":{off:"Idle",pending:"Pending",nosign:"Sign in",syncing:"Syncing…",synced:"Synced",error:"Error",conflict:"Conflict"}[sync]);b.title=syncText()}}
function cloudDialog(){const d=$("#dlg");RC=null;
d.innerHTML=`<form><h3 style="margin-top:0">Cloud sync</h3><p class="sm mu">Paste your config JSON (SUPABASE_URL, SUPABASE_BUCKET, SUPABASE_ANON_KEY, FILES.EXERCISE, AUTO_SYNC, AUTO_SYNC_DELAY, USER_MAIL, PASSWORD). PASSWORD is used once to sign in and is never stored.</p><textarea name="j" rows="11" spellcheck="false" style="width:100%;font-family:monospace;font-size:12px" placeholder='{"SUPABASE_URL":"https://xxxx.supabase.co","SUPABASE_BUCKET":"your-bucket","SUPABASE_ANON_KEY":"anon-key","FILES":{"EXERCISE":"fit.json"},"AUTO_SYNC":true,"AUTO_SYNC_DELAY":300000,"USER_MAIL":"you@mail.com","PASSWORD":"..."}'>${esc(Object.keys(AC).length?JSON.stringify(AC,null,2):"")}</textarea><p class="sm">${esc(syncText())}</p><p class="er sm" id="fe" role="alert"></p><div class="r" style="border:0"><button type="button" data-a="close">Cancel</button><button type="button" class="dg" data-a="cdisc">Disconnect</button><button type="button" data-a="csync">Sync now</button><button class="pri">Connect &amp; sync</button></div></form>`;
d.querySelector("form").onsubmit=async e=>{e.preventDefault();const b=e.submitter;if(b)b.disabled=true;$("#fe").textContent="";
try{await connectJson(e.target.elements.j.value);d.close();toast("Connected");render();await reconcile()}catch(x){$("#fe").textContent=x.message;if(b)b.disabled=false}};d.showModal()}
Object.assign(A,{cloud:cloudDialog,csync:()=>{if(!ready())return toast("Connect first",1);cfg.pending=true;push(true)},
cdisc:()=>{if(tm){clearTimeout(tm);tm=null;dueAt=0}cfg.access=cfg.refresh="";cfg.exp=0;cfg.pending=false;localStorage.removeItem(CFG_KEY);AC={};readConf();saveCfg();sync="off";if($("#dlg").open)$("#dlg").close();render();toast("Cloud sync disconnected (local data untouched)")}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&S&&cfg.pending&&ready()&&signed()&&CONFIG.AUTO){clearTimeout(tm);tm=null;dueAt=0;push(false)}});
window.addEventListener("beforeunload",e=>{if(cfg.pending&&ready()&&signed()){e.preventDefault();e.returnValue=""}});
setInterval(()=>{if(sync==="pending"&&dueAt&&S)hdr()},1000);

async function init(){let d=null;try{d=JSON.parse(localStorage.getItem(KEY))}catch{}
if(!okD(d)){try{const r=await fetch("fit.json",{cache:"no-store"});if(r.ok){const j=await r.json();if(okD(j))d=j}}catch{}}
